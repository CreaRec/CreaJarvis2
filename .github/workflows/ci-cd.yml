name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/crearec/crea-jarvis2
  BRIDGE_IMAGE: ghcr.io/crearec/crea-jarvis2-esp-syslog
  DEPLOY_DIR: /home/crearec/crea-jarvis2

jobs:
  # core / bridge → publish that image. compose → redeploy without mandatory rebuild.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      bridge: ${{ steps.filter.outputs.bridge }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'src/**'
              - 'prisma/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.dockerignore'
              - '.npmrc'
              - 'scripts/**'
              - 'tsconfig.json'
              - 'vitest.config.ts'
            bridge:
              - 'services/esp-syslog-bridge/**'
            compose:
              - 'docker-compose.yml'

  test:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx prisma generate
      - run: npm test

      - name: Bridge install and test
        working-directory: services/esp-syslog-bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm test

      # 3.11: openwakeword pulls tflite-runtime on Linux; no cp312 wheels on PyPI.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # PySide6 needs EGL+xcb; sounddevice needs PortAudio (even offscreen).
      # g++: ESP Voice PE host_tests (header-only, no ESPHome/IDF).
      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libportaudio2 \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1

      - name: Desktop client tests
        working-directory: clients/desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: ESP Voice PE host tests
        working-directory: clients/esp-voice-pe
        run: ./host_tests/run.sh

      - uses: docker/setup-buildx-action@v4
        if: >-
          needs.changes.outputs.core == 'true'
          || needs.changes.outputs.bridge == 'true'

      - name: Build core image (no push)
        if: needs.changes.outputs.core == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Build bridge image (no push)
        if: needs.changes.outputs.bridge == 'true'
        uses: docker/build-push-action@v7
        with:
          context: services/esp-syslog-bridge
          push: false
          tags: ${{ env.BRIDGE_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  publish_core:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.core == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:main,${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  publish_bridge:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.bridge == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${BRIDGE_IMAGE}:main,${BRIDGE_IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/esp-syslog-bridge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes, publish_core, publish_bridge]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.test.result == 'success'
      && (
        needs.changes.outputs.core == 'true'
        || needs.changes.outputs.bridge == 'true'
        || needs.changes.outputs.compose == 'true'
      )
      && (needs.publish_core.result == 'success' || needs.publish_core.result == 'skipped')
      && (needs.publish_bridge.result == 'success' || needs.publish_bridge.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy compose pull/up
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          CORE_IMAGE_TAG: ${{ needs.publish_core.outputs.image_tag }}
          BRIDGE_IMAGE_TAG_NEW: ${{ needs.publish_bridge.outputs.image_tag }}
          CORE_CHANGED: ${{ needs.changes.outputs.core }}
          BRIDGE_CHANGED: ${{ needs.changes.outputs.bridge }}
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SERVER_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${SSH[@]}" "$SSH_TARGET" "mkdir -p '${DEPLOY_DIR}/data/postgres'"
          "${SCP[@]}" docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"

          "${SSH[@]}" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_DIR}'

          if [ ! -f .env ]; then
            echo "ERROR: ${DEPLOY_DIR}/.env is missing. Create it from .env.example (app secrets + IMAGE)." >&2
            exit 1
          fi

          # Export tags only for images published in this run; leave others from .env.
          if [ '${CORE_CHANGED}' = 'true' ] && [ -n '${CORE_IMAGE_TAG}' ]; then
            export IMAGE_TAG='${CORE_IMAGE_TAG}'
          fi
          if [ '${BRIDGE_CHANGED}' = 'true' ] && [ -n '${BRIDGE_IMAGE_TAG_NEW}' ]; then
            export BRIDGE_IMAGE_TAG='${BRIDGE_IMAGE_TAG_NEW}'
          fi

          docker compose pull
          docker compose up -d
          docker compose ps
          if [ '${CORE_CHANGED}' = 'true' ] || [ '${BRIDGE_CHANGED}' != 'true' ]; then
            docker compose logs --tail=30 core || true
          fi
          if [ '${BRIDGE_CHANGED}' = 'true' ] || [ '${CORE_CHANGED}' != 'true' ]; then
            docker compose logs --tail=30 esp-syslog-bridge || true
          fi
          EOF

  # Keep last 10 sha-* tags per package; never delete floating :main.
  # Package Settings → Manage Actions access must grant this repo Admin.
  ghcr_cleanup:
    runs-on: ubuntu-latest
    needs: [publish_core, publish_bridge]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (
        needs.publish_core.result == 'success'
        || needs.publish_bridge.result == 'success'
      )
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune crea-jarvis2 (keep 10 sha-*)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: crea-jarvis2
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true

      - name: Prune crea-jarvis2-esp-syslog (keep 10 sha-*)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: crea-jarvis2-esp-syslog
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true
