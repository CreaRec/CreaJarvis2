<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis PTT (temp)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel">
      <p class="badge">temporary client · not part of core</p>
      <h1>Jarvis PTT</h1>
      <p class="hint">Удерживайте кнопку, говорите, отпустите. Core: Docker на :8787</p>

      <label class="field">
        <span>Voice Gateway</span>
        <input id="wsUrl" type="text" value="ws://127.0.0.1:8787/voice" spellcheck="false" />
      </label>

      <div class="row">
        <button id="connectBtn" type="button">Connect</button>
        <span id="status" class="status">disconnected</span>
      </div>

      <button id="talkBtn" type="button" class="talk" disabled>
        Hold to talk
      </button>

      <form id="textForm" class="text-row">
        <input
          id="textInput"
          type="text"
          placeholder="Напишите сообщение…"
          autocomplete="off"
          disabled
        />
        <button id="sendBtn" type="submit" disabled>Send</button>
      </form>

      <pre id="log" class="log" aria-live="polite"></pre>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
