[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-jarvis-desktop"
version = "0.1.0"
description = "CreaJarvis desktop voice client (replaces web-ptt)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "websockets>=12.0",
  "PySide6>=6.6",
  "PySide6-Addons>=6.6",
  "qasync>=0.27",
  "httpx>=0.27",
  "pymicro-wakeword>=2.4.0",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
jarvis-desktop = "jarvis_client.app:main"

[tool.setuptools.packages.find]
include = ["jarvis_client*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
