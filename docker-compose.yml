services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Host 5433 — 5432/5435 used by other stacks; container stays on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  core:
    image: ${IMAGE:-ghcr.io/crearec/crea-jarvis2}:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/${POSTGRES_DB:-jarvis}
      PORT: "8787"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-crea-jarvis}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-apps}
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    ports:
      - "8787:8787"
    networks:
      - default
      - lgtm

  # ESPHome syslog → OTLP logs (service.name=crea-jarvis-client)
  esp-syslog-bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/crearec/crea-jarvis2-esp-syslog}:${BRIDGE_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: crea-jarvis-client
      OTEL_SERVICE_NAMESPACE: apps
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-}
      SYSLOG_UDP_PORT: "1514"
    ports:
      - "${SYSLOG_UDP_PORT:-1514}:1514/udp"
    networks:
      - default
      - lgtm

networks:
  lgtm:
    external: true
