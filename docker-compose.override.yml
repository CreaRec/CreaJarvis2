services:
  core:
    build:
      context: .
      target: dev
      secrets:
        - NODE_AUTH_TOKEN
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    command:
      [
        "sh",
        "-c",
        "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server/index.ts",
      ]

secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN
